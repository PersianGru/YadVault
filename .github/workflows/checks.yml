name: Checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    name: Files, links and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python .github/scripts/check_repo.py

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every compose file and combination is valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only/; s/^YADVAULT_RO_PASSWORD=$/YADVAULT_RO_PASSWORD=ci-only/' .env
          docker compose --profile embeddings --profile mcp --profile avatars --profile llm config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.gateway.yml -f docker-compose.https.yml -f docker-compose.watch.yml -f docker-compose.backups.yml config > /dev/null
          DNS_PROVIDER=cloudflare docker compose -f docker-compose.yml -f docker-compose.https.yml -f docker-compose.https-dns.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile embeddings --profile llm config > /dev/null
          for f in install/synology/docker-compose.yml install/truenas/docker-compose.yml install/casaos/docker-compose.yml; do docker compose -f "$f" config > /dev/null; done

  images:
    name: Pinned images exist
    # the images are published by the YadVault release; this runs for release tags and on demand
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every image of the compose files and templates can be pulled anonymously
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only/; s/^YADVAULT_RO_PASSWORD=$/YADVAULT_RO_PASSWORD=ci-only/' .env
          {
            docker compose --profile embeddings --profile mcp --profile avatars --profile llm config --images
            docker compose -f docker-compose.yml -f docker-compose.https.yml config --images
            docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile embeddings config --images
            for f in install/synology/docker-compose.yml install/truenas/docker-compose.yml install/casaos/docker-compose.yml install/umbrel/yadvault/docker-compose.yml; do
              grep -oE 'image: *[^ ]+' "$f" | sed 's/image: *//'
            done
            sed -n 's#.*<Repository>\(.*\)</Repository>.*#\1#p' install/unraid/*.xml
          } | grep -v '^yadvault-caddy' | sort -u | tee images.txt
          status=0
          while read -r image; do
            if docker manifest inspect "$image" > /dev/null 2>&1; then echo "ok      $image"; else echo "MISSING $image"; status=1; fi
          done < images.txt
          exit $status

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
